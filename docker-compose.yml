services:
  api-key-rotator:
    build: .
    # or: image: ghcr.io/<you>/api-key-rotator:latest
    environment:
      FIRECRAWL_API_KEYS: "fc-key1,fc-key2,fc-key3"
      UPSTREAM: "https://api.firecrawl.dev"
      PORT: "8788"
      MAX_PASSES: "2"
      MAX_BODY_BYTES: "16777216"
      CREDIT_RESET_DAY: "1"
      LOW_CREDIT_THRESHOLD: "10"
      STOP_CREDIT_THRESHOLD: "2"
      CREDIT_REFRESH_INTERVAL: "300"
      LOG_LEVEL: "info"
      # FIRECRAWL_MAX_CONCURRENT_PER_KEY: "1"      # max in-flight per firecrawl key (0=unlimited)
      # FIRECRAWL_CONCURRENCY_SATURATION: "queue"  # queue | reject when all keys busy
      # FIRECRAWL_CONCURRENCY_QUEUE_MS: "15000"    # queued wait for a free slot before 503
      # FIRECRAWL_403_RETRIES: "1"                 # same-key 403 retries before rotating
      # UPSTREAM_PROXY: "http://corp-proxy:3128"   # optional egress proxy
      # TAVILY_API_KEYS: "tvly-key1,tvly-key2"     # optional tavily profile
      # TAVILY_UPSTREAM: "https://api.tavily.com"
      # TAVILY_ROUTE_PREFIX: "/tavily"
      # EXA_API_KEYS: "exa-key1,exa-key2"         # optional exa profile
      # EXA_UPSTREAM: "https://api.exa.ai"
      # EXA_ROUTE_PREFIX: "/exa"                   # stripped before forwarding
      # EXA_BUDGET_USD: "10.00"                    # per-key monthly budget (free tier)
      # EXA_LOW_CREDIT_USD: "0.50"                 # rotate off a key below this
      # EXA_STOP_CREDIT_USD: "0.10"                # 503 when every key is below this
      # APIFY_API_KEYS: "apify-token1,apify-token2" # optional apify profile
      # APIFY_UPSTREAM: "https://api.apify.com"     # point at your own fake/stub for testing
      # APIFY_ROUTE_PREFIX: "/v2/acts"              # kept in forwarded path
      # APIFY_TIMEOUT_SEC: "180"                    # sync actor runs take 30-120s
      # APIFY_FREE_CREDIT_USD: "5"                  # override included monthly credit (default: read from account)
      # APIFY_LOW_CREDIT_USD: "0.10"                # rotate off a token below this balance
      # APIFY_STOP_CREDIT_USD: "0.05"               # 503 when every token is below this
      # --- Finance (daily-capped) profiles: /fmp, /alphavantage, /marketaux ---
      # FMP_API_KEYS: "fmp-k1,fmp-k2"              # FMP free tier ~250 req/day; 429 "Limit Reach" disables until reset
      # FMP_UPSTREAM: "https://financialmodelingprep.com"
      # FMP_ROUTE_PREFIX: "/fmp"
      # FMP_DAILY_BUDGET: "250"                    # predicted requests/day (seeded at startup)
      # FMP_STOP_CREDIT: "1"                       # 503 when predicted remaining <= this (protects a real 429)
      # ALPHAVANTAGE_API_KEYS: "av-k1,av-k2"       # free tier 25 req/day; HTTP 200 + body Note = daily cap
      # ALPHAVANTAGE_UPSTREAM: "https://www.alphavantage.co"
      # ALPHAVANTAGE_ROUTE_PREFIX: "/alphavantage"
      # ALPHAVANTAGE_DAILY_BUDGET: "25"
      # ALPHAVANTAGE_STOP_CREDIT: "1"
      # MARKETAUX_API_KEYS: "mk-k1,mk-k2"          # free tier 100 req/day; 402 usage_limit_reached disables
      # MARKETAUX_UPSTREAM: "https://api.marketaux.com"
      # MARKETAUX_ROUTE_PREFIX: "/marketaux"
      # MARKETAUX_DAILY_BUDGET: "100"
      # MARKETAUX_STOP_CREDIT: "1"
    ports:
      - "8788:8788"
    healthcheck:
      test: ["CMD", "/api-key-rotator", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  firecrawl:
    image: ghcr.io/open-webui/mcpo:latest
    entrypoint: ["uvx", "mcpo"]
    command: ["--host", "0.0.0.0", "--port", "8000", "--config", "/config/config.json"]
    volumes:
      - ./config:/config:ro
    depends_on:
      api-key-rotator:
        condition: service_healthy
    environment:
      # mcpo's config.json sets FIRECRAWL_API_URL per MCP server; shown here
      # for clarity. The key is REMOVED - the rotator injects it.
      FIRECRAWL_API_URL: "http://api-key-rotator:8788"
    restart: unless-stopped
